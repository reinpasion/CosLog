@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--p:#1d2128;--t:#e6e9ef;--l:#39414f;--a:#5b9cff;--w:#4ade80;--c:#e6e9ef;--gr:#2d3440}}
:root[data-theme="dark"]{--bg:#14171c;--p:#1d2128;--t:#e6e9ef;--l:#39414f;--a:#5b9cff;--w:#4ade80;--c:#e6e9ef;--gr:#2d3440}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--t);font:13px system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;height:100%}aside{width:168px;background:var(--p);border-right:1px solid var(--l);padding:6px;overflow:hidden;display:flex;flex-direction:column;gap:4px}
main{position:relative;flex:1;display:flex;flex-direction:column;min-width:0}header,footer{background:var(--p);border-bottom:1px solid var(--l);padding:5px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
footer{border:0;border-top:1px solid var(--l);font-size:12px;opacity:.85}
button,input,select{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:5px;padding:4px 8px}button{cursor:pointer}
button:hover{border-color:var(--a)}button:disabled{opacity:.4;cursor:not-allowed}button:disabled:hover{border-color:var(--l)}button.on{background:var(--a);color:#fff;border-color:var(--a)}input{width:70px}input:disabled{opacity:.4}
#cv{flex:1;width:100%;min-height:0;touch-action:none;display:block}#pj{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:min(520px,94%);background:var(--p);border:1px solid var(--l);border-radius:8px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:5}#pj[hidden]{display:none}#pj textarea{width:100%;height:180px;margin-top:6px;background:var(--bg);color:var(--t);border:1px solid var(--l);border-radius:5px;font:11px monospace}

h4{margin:6px 0 2px;font-size:11px;opacity:.6;text-transform:uppercase}
