[package]
name = "circuit_core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1.8"

[build-dependencies]
# preserve_order keeps parts in spec/parts.json file order, which Kind::ALL (and the symbol golden file) depend on.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }